name: Render BGM

on:
  push:
    paths:
      - 'bgm/midi/*.mid'
      - 'bgm/midi/*.midi'
  workflow_dispatch:

env:
  OUTPUT_DIR: bgm/output

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache Fluid R3 SoundFont
        uses: actions/cache@v4
        id: sf-cache
        with:
          path: /tmp/sf2
          key: fluidr3-gm-v1

      - name: Install FluidSynth + FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluidsynth ffmpeg

      - name: Download Fluid R3 GM SoundFont
        if: steps.sf-cache.outputs.cache-hit != 'true'
        run: |
          echo "⬇️ Downloading Fluid R3 GM (142MB, 1회만)..."
          sudo apt-get install -y -qq fluid-soundfont-gm
          mkdir -p /tmp/sf2
          cp /usr/share/sounds/sf2/FluidR3_GM.sf2 /tmp/sf2/
          echo "✅ Cached to /tmp/sf2/"

      - name: Restore SoundFont from cache
        if: steps.sf-cache.outputs.cache-hit == 'true'
        run: |
          echo "✅ Restored from cache"
          ls -lh /tmp/sf2/

      - name: Render MIDI → MP3
        run: |
          SF="/tmp/sf2/FluidR3_GM.sf2"

          # 캐시 미스 시 apt에서 가져오기
          if [ ! -f "$SF" ]; then
            SF="/usr/share/sounds/sf2/FluidR3_GM.sf2"
          fi

          echo "🎹 SoundFont: $(basename "$SF")"
          file "$SF"
          ls -lh "$SF"

          mkdir -p "$OUTPUT_DIR"
          count=0

          for midi in bgm/midi/*.mid bgm/midi/*.midi; do
            [ -f "$midi" ] || continue
            name=$(basename "$midi" | sed 's/\.mid[i]*$//')
            wav="$OUTPUT_DIR/$name.wav"
            mp3="$OUTPUT_DIR/$name.mp3"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🎵 $name"

            # fast-render: 오디오 드라이버 완전 우회
            fluidsynth -ni -F "$wav" -O s16 -r 44100 -g 1.5 \
              "$SF" "$midi" 2>&1 | tail -1

            # WAV → MP3
            ffmpeg -y -i "$wav" \
              -codec:a libmp3lame -b:a 192k \
              -filter:a "loudnorm=I=-16:LRA=11:TP=-1.5" \
              "$mp3" 2>/dev/null

            rm -f "$wav"
            size=$(du -h "$mp3" | cut -f1)
            dur=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$mp3" 2>/dev/null || echo "?")
            echo "   ✅ $mp3 (${size}, ${dur}s)"
            count=$((count + 1))
          done

          echo "RENDER_COUNT=$count" >> $GITHUB_ENV

      - name: Commit rendered MP3s
        if: env.RENDER_COUNT > 0
        run: |
          git config user.name "Helena BGM Studio"
          git config user.email "bgm@helena.piano"
          git add bgm/output/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "bgm: render ${RENDER_COUNT} track(s) [skip ci]"
            git push
            echo "✅ Pushed ${RENDER_COUNT} tracks"
          fi
