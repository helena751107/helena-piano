name: Render BGM

on:
  push:
    paths:
      - 'bgm/midi/*.mid'
      - 'bgm/midi/*.midi'
  workflow_dispatch:
    inputs:
      soundfont:
        description: 'SoundFont'
        required: false
        default: 'salamander'
        type: choice
        options:
          - salamander
          - fluidr3

env:
  OUTPUT_DIR: bgm/output

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Salamander SoundFont
        uses: actions/cache@v4
        id: sf-cache
        with:
          path: /tmp/salamander.sf2
          key: salamander-grand-piano-v3

      - name: Download Salamander Grand Piano SF2
        if: steps.sf-cache.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Salamander Grand Piano (Yamaha C5, 244MB)..."
          wget -q --show-progress -O /tmp/salamander.sf2 \
            "https://github.com/sfzinstruments/SalamanderGrandPiano/releases/download/v3/salamander-grand-piano-v3.sf2" \
            || echo "SKIPPED: Salamander download failed, will use Fluid R3"

      - name: Install FluidSynth + FFmpeg + Fluid R3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluidsynth ffmpeg fluid-soundfont-gm

      - name: Render MIDI → MP3
        run: |
          mkdir -p "$OUTPUT_DIR"

          # SoundFont 선택
          SF="/usr/share/sounds/sf2/FluidR3_GM.sf2"
          SF_NAME="Fluid R3 GM"
          if [ -f /tmp/salamander.sf2 ] && [ -s /tmp/salamander.sf2 ]; then
            SF="/tmp/salamander.sf2"
            SF_NAME="Salamander Grand Piano"
          fi
          echo "🎹 SoundFont: $SF_NAME"

          # 렌더링
          count=0
          for midi in bgm/midi/*.mid bgm/midi/*.midi; do
            [ -f "$midi" ] || continue
            name=$(basename "$midi" | sed 's/\.mid[i]*$//')
            wav="$OUTPUT_DIR/$name.wav"
            mp3="$OUTPUT_DIR/$name.mp3"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🎵 $name → $SF_NAME"

            fluidsynth -ni -g 1.5 -r 44100 \
              -o audio.file.format=wav \
              -o audio.file.name="$wav" \
              "$SF" "$midi"

            ffmpeg -y -i "$wav" \
              -codec:a libmp3lame -b:a 192k \
              -filter:a "loudnorm=I=-16:LRA=11:TP=-1.5" \
              "$mp3" 2>/dev/null

            rm -f "$wav"
            size=$(du -h "$mp3" | cut -f1)
            dur=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$mp3" 2>/dev/null || echo "?")
            echo "   ✅ $mp3 (${size}, ${dur}s)"
            count=$((count + 1))
          done
          echo "count=$count" >> $GITHUB_ENV
          echo "sf_name=$SF_NAME" >> $GITHUB_ENV

      - name: Generate catalog.json
        run: |
          echo "[" > "$OUTPUT_DIR/catalog.json"
          first=true
          for mp3 in "$OUTPUT_DIR"/*.mp3; do
            [ -f "$mp3" ] || continue
            name=$(basename "$mp3" .mp3)
            size=$(stat -c%s "$mp3")
            dur=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$mp3" 2>/dev/null || echo "0")
            url="https://helena751107.github.io/helena-piano/$OUTPUT_DIR/$name.mp3"
            $first || echo "," >> "$OUTPUT_DIR/catalog.json"
            first=false
            printf '  {"name":"%s","url":"%s","size":%s,"duration":%s}\n' "$name" "$url" "$size" "$dur" >> "$OUTPUT_DIR/catalog.json"
          done
          echo "]" >> "$OUTPUT_DIR/catalog.json"
          echo "📋 catalog.json created"

      - name: Commit rendered MP3s
        run: |
          git config user.name "Helena BGM Studio"
          git config user.email "bgm@helena.piano"
          git add bgm/output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "bgm: auto-render ${count} tracks (${sf_name}) [skip ci]"
            git push
            echo "✅ Committed & pushed"
          fi
