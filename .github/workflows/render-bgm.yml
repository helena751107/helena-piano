name: Render BGM

on:
  push:
    paths:
      - 'bgm/midi/*.mid'
      - 'bgm/midi/*.midi'
  workflow_dispatch:
    inputs:
      soundfont:
        description: 'SoundFont'
        required: false
        default: 'fluidr3'
        type: choice
        options:
          - fluidr3
          - salamander

env:
  OUTPUT_DIR: bgm/output

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install FluidSynth + FFmpeg + Fluid R3 SoundFont
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluidsynth ffmpeg fluid-soundfont-gm
          echo "✅ FluidSynth $(fluidsynth --version | head -1)"

      - name: Render MIDI → MP3
        run: |
          mkdir -p "$OUTPUT_DIR"

          # Fluid R3 GM SoundFont (apt로 설치됨, 피아노 양호)
          SF="/usr/share/sounds/sf2/FluidR3_GM.sf2"
          SF_NAME="Fluid R3 GM"

          # Salamander가 있으면 그걸로 (수동 업로드)
          if [ -f bgm/salamander.sf2 ] && [ -s bgm/salamander.sf2 ]; then
            SF="bgm/salamander.sf2"
            SF_NAME="Salamander Grand Piano"
          fi

          echo "🎹 SoundFont: $SF_NAME"
          file "$SF"
          ls -lh "$SF"

          count=0
          for midi in bgm/midi/*.mid bgm/midi/*.midi; do
            [ -f "$midi" ] || continue
            name=$(basename "$midi" | sed 's/\.mid[i]*$//')
            wav="$OUTPUT_DIR/$name.wav"
            mp3="$OUTPUT_DIR/$name.mp3"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🎵 $name → $SF_NAME"

            # fluidsynth -a file: ALSA 없이 파일로 직접 출력
            fluidsynth -a file -g 1.5 -r 44100 \
              -O wav \
              -o audio.file.name="$wav" \
              "$SF" "$midi" 2>&1 | tail -3

            # WAV → MP3 (192kbps, LUFS 노멀라이즈)
            ffmpeg -y -i "$wav" \
              -codec:a libmp3lame -b:a 192k \
              -filter:a "loudnorm=I=-16:LRA=11:TP=-1.5" \
              "$mp3" 2>/dev/null

            rm -f "$wav"
            size=$(du -h "$mp3" | cut -f1)
            dur=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$mp3" 2>/dev/null || echo "?")
            echo "   ✅ $mp3 (${size}, ${dur}s)"
            count=$((count + 1))
          done
          echo "RENDER_COUNT=$count" >> $GITHUB_ENV
          echo "SF_NAME=$SF_NAME" >> $GITHUB_ENV

      - name: Generate catalog.json
        if: env.RENDER_COUNT > 0
        run: |
          echo "[" > "$OUTPUT_DIR/catalog.json"
          first=true
          for mp3 in "$OUTPUT_DIR"/*.mp3; do
            [ -f "$mp3" ] || continue
            name=$(basename "$mp3" .mp3)
            size=$(stat -c%s "$mp3")
            dur=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 "$mp3" 2>/dev/null || echo "0")
            url="https://helena751107.github.io/helena-piano/$OUTPUT_DIR/$name.mp3"
            $first || echo "," >> "$OUTPUT_DIR/catalog.json"
            first=false
            printf '  {"name":"%s","url":"%s","size":%s,"duration":%s}\n' "$name" "$url" "$size" "$dur" >> "$OUTPUT_DIR/catalog.json"
          done
          echo "]" >> "$OUTPUT_DIR/catalog.json"
          cat "$OUTPUT_DIR/catalog.json"

      - name: Commit rendered MP3s
        if: env.RENDER_COUNT > 0
        run: |
          git config user.name "Helena BGM Studio"
          git config user.email "bgm@helena.piano"
          git add bgm/output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "bgm: render ${RENDER_COUNT} track(s) — ${SF_NAME} [skip ci]"
            git push
            echo "✅ Committed & pushed: ${RENDER_COUNT} tracks"
          fi
